name: Fix customer promotion source of truth

on:
  push:
    paths:
      - 'scripts/fix-promo-source-of-truth-20260917.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply promo source-of-truth patch
        run: python3 scripts/fix-promo-source-of-truth-20260917.py
      - name: Syntax checks
        run: node --check server.js && node --check management/app.js
      - name: Commit fix
        run: |
          if git diff --quiet -- server.js management/app.js; then
            echo "No application changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add server.js management/app.js
          git commit -m "Use promotion settings as customer-facing source of truth"
          git push
