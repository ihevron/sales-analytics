name: Fix hidden products in promotions

on:
  push:
    paths:
      - .github/workflows/fix-hidden-promotions.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch promotions filter
        shell: bash
        run: python3 -c "from pathlib import Path; p=Path('management/app.js'); s=p.read_text(); old='    WHERE COALESCE(s.sale_price, p.sale_price, 0) > 0\\n      OR COALESCE(s.promo_discount_percent, p.promo_discount_percent, 0) > 0\\n    ORDER BY updated_at DESC, p.description ASC'; new='    WHERE COALESCE(s.hidden, p.hidden, 0) = 0\\n      AND (\\n        COALESCE(s.sale_price, p.sale_price, 0) > 0\\n        OR COALESCE(s.promo_discount_percent, p.promo_discount_percent, 0) > 0\\n      )\\n    ORDER BY updated_at DESC, p.description ASC'; assert old in s, 'expected promotions query not found'; p.write_text(s.replace(old,new,1))"
      - name: Syntax check
        run: node --check management/app.js
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management/app.js
          git commit -m "Hide hidden products from promotions list"
          git push
