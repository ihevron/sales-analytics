name: Optimize order process workflow

on:
  push:
    paths:
      - 'scripts/optimize-order-process-20260917.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Apply order process optimization patch
        run: python3 scripts/optimize-order-process-20260917.py
      - name: Syntax checks
        run: node --check management/app.js
      - name: Commit optimized workflow
        run: |
          if git diff --quiet -- management/app.js management/index.html management/styles.css; then
            echo "No application changes to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add management/app.js management/index.html management/styles.css
          git commit -m "Optimize order process batch workflow"
          git push
