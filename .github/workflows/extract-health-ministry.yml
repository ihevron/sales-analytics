name: Apply Health Ministry Supabase Persistence

on:
  push:
    branches:
      - agent/health-ministry-supabase-persistence
    paths:
      - .github/workflows/extract-health-ministry.yml

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Apply source patches
        run: |
          python3 tools/fix_frontend_patch_script.py
          python3 -m py_compile tools/patch_health_ministry_frontend.py tools/patch_health_ministry_server.py tools/finalize_health_ministry_patch.py
          python3 tools/patch_health_ministry_frontend.py
          python3 tools/finalize_health_ministry_patch.py
          python3 tools/patch_health_ministry_server.py

      - name: Validate JavaScript and behavior
        run: |
          node --check server.js
          node --check install-health-ministry.js
          node --check health-ministry-src/health-ministry.js
          node tools/test_health_ministry_persistence.js

      - name: Validate Docker build
        run: docker build --tag health-ministry-supabase-test .

      - name: Commit validated implementation
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/extract-health-ministry.yml
          git rm -r tools
          git rm health-ministry-payload-*.txt
          git add server.js Dockerfile install-health-ministry.js health-ministry-src
          git commit -m 'Persist Ministry of Health reference data in Supabase [skip ci]'
          git push
